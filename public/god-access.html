<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>God Admin | FFGC2K26</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #35215d, #090b17 70%);
  color: white;
  font-family: system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.panel {
  width: 100%;
  max-width: 420px;
  padding: 32px 25px;
  background: rgba(17, 22, 43, 0.95);
  border: 1px solid #7055ac;
  border-radius: 22px;
  box-shadow: 0 0 45px rgba(143, 89, 255, 0.15);
}

.logo {
  color: #b99aff;
  letter-spacing: 3px;
  font-size: 12px;
  font-weight: 800;
}

h1 {
  margin: 15px 0;
  font-size: 29px;
}

p {
  color: #aab1ca;
  line-height: 1.6;
}

input {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  background: #090e20;
  color: white;
  border: 1px solid #555277;
  border-radius: 11px;
  font-size: 16px;
}

button, .dashboard-link {
  display: block;
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  background: linear-gradient(135deg, #b78cff, #7755ff);
  color: #090b17;
  border: 0;
  border-radius: 11px;
  font-size: 16px;
  font-weight: 800;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

#error {
  color: #ff8da3;
}

#success {
  color: #76f0b6;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="panel">

  <div class="logo">✦ FFGC2K26</div>

  <h1>👑 GOD ADMIN</h1>

  <p>
    Welcome to the FFGC2K26 Command Center.
    Administrative access is restricted.
  </p>

  <form id="loginForm">

    <input
      id="username"
      type="text"
      placeholder="Admin Username"
      autocomplete="username"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Admin Password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">
      ENTER COMMAND CENTER
    </button>

  </form>

  <p id="error" role="alert"></p>
  <p id="success" role="status"></p>

  <div id="dashboard" class="hidden">

    <a class="dashboard-link" href="/">
      OPEN ARENA DASHBOARD →
    </a>

    <p>
      You are authenticated as God Admin.
    </p>

  </div>

</div>

<script>
const form = document.getElementById('loginForm');
const error = document.getElementById('error');
const success = document.getElementById('success');
const dashboard = document.getElementById('dashboard');
const loginButton = document.getElementById('loginButton');

async function checkAdmin() {
  try {
    const response = await fetch('/api/public', {
      credentials: 'same-origin',
      cache: 'no-store'
    });

    if (!response.ok) return;

    const data = await response.json();

    if (data.admin === true) {
      form.classList.add('hidden');
      dashboard.classList.remove('hidden');
      success.textContent = '✓ Admin session active';
    }
  } catch (e) {
    console.error('Session check failed', e);
  }
}

form.addEventListener('submit', async function(event) {
  event.preventDefault();

  error.textContent = '';
  success.textContent = '';
  loginButton.disabled = true;
  loginButton.textContent = 'AUTHENTICATING...';

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });

    if (!response.ok) {
      error.textContent = 'Incorrect admin username or password.';
      return;
    }

    form.classList.add('hidden');
    dashboard.classList.remove('hidden');

    success.textContent = '✓ God Admin authentication successful';

  } catch (e) {
    error.textContent = 'Connection error. Please try again.';
  } finally {
    loginButton.disabled = false;
    loginButton.textContent = 'ENTER COMMAND CENTER';
  }
});

checkAdmin();
</script>

</body>
</html>
