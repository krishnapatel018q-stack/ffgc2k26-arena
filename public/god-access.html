<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>God Admin — FFGC2K26</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#322452,#090c19 65%);font:16px system-ui;color:white;padding:18px;box-sizing:border-box}form{background:#131a30;border:1px solid #554d7b;border-radius:20px;padding:30px;width:min(100%,360px);box-sizing:border-box}h1{font-size:24px}small{color:#9fe9ef;letter-spacing:2px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:10px;font:inherit}input{background:#0b1022;border:1px solid #4c4d70;color:white}button{background:#9b79ff;border:0;color:#090c19;font-weight:800;cursor:pointer}#error{color:#ff9cae}</style></head><body><form id="form"><small>✦ FFGC2K26 / SECURE ACCESS</small><h1>God Admin Login</h1><p>Restricted administrative access during Arena shutdown.</p><input name="username" placeholder="Admin username" required autocomplete="username"><input name="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Enter Command Center</button><p id="error" role="alert"></p></form><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=e.target;const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.username.value,password:f.password.value})});if(r.ok)location.href='/';else document.getElementById('error').textContent='Login unsuccessful. Check your credentials.'}</script></body></html>
