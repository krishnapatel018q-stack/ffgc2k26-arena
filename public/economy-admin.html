<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070d18">
  <title>FFGC2K26 | Economy Command</title>
  <link rel="stylesheet" href="/economy.css?v=4">
</head>
<body>

<header>
  <div class="brand">👑 FFGC2K26 / MARKET COMMAND</div>
  <a href="/#admin">← Back to God Admin</a>
</header>

<main>
  <div class="terminal">
    <span class="terminal-kicker">RESTRICTED ADMIN CONTROL</span>
    <h1>Market Command Center</h1>
    <p>Private financial simulation management.</p>
  </div>

  <div id="status"></div>

  <div id="adminLock" class="card">
    🔐 Log in as God Admin on the
    <a href="/#admin">main website</a>, then return here.
  </div>

  <div id="adminApp" class="hidden">
    <div class="tabs" id="tabs">
      <button data-tab="overview">Overview</button>
      <button data-tab="companies">📈 Companies</button>
      <button data-tab="scheduler">⏰ Scheduler</button>
      <button data-tab="cash">🏦 Bank</button>
      <button data-tab="orders">💹 Approvals</button>
      <button data-tab="holdings">👥 Holdings</button>
      <button data-tab="business">🏢 Businesses</button>
      <button data-tab="shop">🛒 Marketplace</button>
      <button data-tab="settings">⚙️ Settings</button>
      <button data-tab="history">📜 Audit</button>
    </div>

    <div id="content"></div>
  </div>
</main>

<script src="/economy.js?v=4"></script>
</body>
</html>
