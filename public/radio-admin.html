<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b20"><title>FFGC2K26 Radio Control Room</title><link rel="stylesheet" href="/radio.css"></head><body style="margin:0;background:#070914"><main class="radio-admin-wrap"><p style="letter-spacing:2px;color:#b99bff;font-size:10px;font-weight:900">FFGC2K26 BROADCAST NETWORK</p><h1>◉ RADIO CONTROL ROOM</h1><p style="color:#a8a1bd">THE VOICE OF THE ARENA · MOBILE ADMIN</p><section class="radio-admin-card"><h2>Upload a broadcast</h2><form id="radioUploadForm"><label>Broadcast title<input id="radioTitle" maxlength="100" required placeholder="e.g. Official Investigator Warning"></label><label>Description<textarea id="radioDescription" maxlength="500" placeholder="Add a short description"></textarea></label><label>Voice note / audio file<input id="radioFile" type="file" accept="audio/*,.m4a,.mp3,.wav,.ogg,.aac,.webm" required></label><p style="color:#a69eb9;font-size:11px">Maximum file size: 25 MB. Uploads are private until you publish them.</p><button type="submit" id="radioUploadBtn">↑ Upload broadcast</button><div class="radio-upload-progress"><i id="radioUploadBar"></i></div><p class="radio-admin-status" id="radioAdminStatus">Ready to upload.</p></form></section><section class="radio-admin-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Broadcast library</h2><button class="secondary" id="radioAdminRefresh">↻ Refresh</button></div><div id="radioAdminList">Loading…</div></section><p><a href="/" style="color:#c6a8ff">← Return to FFGC2K26 Hall</a></p></main><script src="/radio-admin.js"></script></body></html>
